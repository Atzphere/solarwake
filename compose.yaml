services:
  solarwake:
    build: .
    container_name: solarwake
    restart: unless-stopped

    env_file: .env
    environment:
      DATA_DIR: /data

    volumes:
      - solarwake_data:/data

    networks:
      - caddy-internal

    security_opt:
      - no-new-privileges:true

volumes:
  solarwake_data:

networks:
  caddy-internal:
    external: true